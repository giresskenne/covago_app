; php.ini - Custom PHP configuration

; Disable display of errors
display_errors = Off

; Enable error logging
log_errors = On

; Set the error log file path
error_log = /var/log/php_errors.log

file_uploads = On
upload_tmp_dir = /var/www/html/uploads/tmp
upload_max_filesize = 10M
post_max_size = 10M
